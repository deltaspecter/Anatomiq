# Prüft bei jedem Push und Pull Request Typen, Tests, Build und den Browsertest.
name: CI

on:
  push:
    branches: [main, claude/anatomiq-3d-anatomy-app-g14ql5]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung, Unit- und Datentests
        run: npm run check
      - name: Produktions-Build
        run: npm run build
      - name: Chromium für den Browsertest
        run: npx playwright-core install --with-deps chromium
      - name: Browsertest (Auswahl, Panel, Ebenen, CSP, Service Worker, Offline, Mobil)
        run: npm run test:e2e
